# ----------------------------------------------------------------------------------
# Commands to run this compose file:
#
#   docker compose -p classmate_backend -f docker-compose.yml up -d
#       - Starts containers in detached mode (-d)
#       - Uses existing images if already built
#
#   docker compose -p classmate_backend -f docker-compose.yml up -d --build
#       - Forces rebuild of images before starting containers
# ----------------------------------------------------------------------------------

# version: "3.9"

services:

  # ===============================
  # PostgreSQL
  # ===============================
  postgres:
    image: postgres:16
    container_name: cm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cm-network


  # ===============================
  # MongoDB
  # ===============================
  mongodb:
    image: mongo:7
    container_name: cm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - cm-network

  # ===============================
  # User Service
  # ===============================
  user-service:
    build:
      context: ./user-service
    image: classmate_backend-user-service
    container_name: user-service
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8083:8083"
    networks:
      - cm-network

  # ===============================
  # Course Service
  # ===============================
  course-service:
    build:
     context: ./course-service
    image: classmate_backend-course-service
    container_name: course-service
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - cm-network

  # ===============================
  # Task Service
  # ===============================
  task-service:
    build:
     context: ./task-service
    image: classmate_backend-task-service
    container_name: task-service
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
    ports:
      - "8082:8082"
    command: ["./wait-for-it.sh", "cm-mongodb:27017", "--", "java", "-jar", "app.jar", "--spring.profiles.active=docker"]
    networks:
      - cm-network

networks:
  cm-network:
    driver: bridge

volumes:
  pgdata:
  mongodata:
